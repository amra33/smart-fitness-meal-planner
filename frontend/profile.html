<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Fitness - Profile</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-shell">
    <aside class="sidebar">
        <div class="sidebar-avatar">
            <div class="avatar-circle" id="avatarInitial">S</div>
            <p class="sidebar-hello">Hello, <span id="sidebarName">there</span></p>
        </div>
        <nav class="sidebar-nav">
            <a href="profile.html" class="sidebar-link active">👤 Profile</a>
            <a href="foodlog.html" class="sidebar-link">🍽️ Log Food</a>
            <a href="progress.html" class="sidebar-link">📊 Progress</a>
        </nav>
        <button class="sidebar-logout" onclick="logout()">🚪 Logout</button>
    </aside>

    <main class="app-main">
        <div class="main-content">
            <h1>Smart Fitness</h1>
            <h2>My Profile</h2>
            <p id="message"></p>

            <div class="info-grid">
                <div class="info-card">
                    <div class="info-icon icon-lime">👤</div>
                    <div>
                        <div class="label">Name</div>
                        <div class="value" id="name"></div>
                    </div>
                </div>
                <div class="info-card">
                    <div class="info-icon icon-blue">✉️</div>
                    <div>
                        <div class="label">Email</div>
                        <div class="value" id="email"></div>
                    </div>
                </div>
                <div class="info-card">
                    <div class="info-icon icon-orange">🎂</div>
                    <div>
                        <div class="label">Age</div>
                        <div class="value" id="age"></div>
                    </div>
                </div>
                <div class="info-card">
                    <div class="info-icon icon-red">📏</div>
                    <div>
                        <div class="label">Height</div>
                        <div class="value" id="height"></div>
                    </div>
                </div>
                <div class="info-card">
                    <div class="info-icon icon-blue">⚖️</div>
                    <div>
                        <div class="label">Weight</div>
                        <div class="value" id="weight"></div>
                    </div>
                </div>
                <div class="info-card">
                    <div class="info-icon icon-lime">🏃</div>
                    <div>
                        <div class="label">Activity Level</div>
                        <div class="value" id="activityLevel"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="script.js"></script>
</body>
</html>
