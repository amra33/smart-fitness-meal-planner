<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Progress - Smart Fitness & Meal Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-shell">
    <aside class="sidebar">
        <div class="sidebar-avatar">
            <div class="avatar-circle" id="avatarInitial">S</div>
            <p class="sidebar-hello">Hello, <span id="sidebarName">there</span></p>
        </div>
        <nav class="sidebar-nav">
            <a href="profile.html" class="sidebar-link">👤 Profile</a>
            <a href="foodlog.html" class="sidebar-link">🍽️ Log Food</a>
            <a href="progress.html" class="sidebar-link active">📊 Progress</a>
        </nav>
        <button class="sidebar-logout" onclick="logout()">🚪 Logout</button>
    </aside>

    <main class="app-main">
        <div class="main-content">
            <h1>Your Progress</h1>

            <div class="date-picker-row">
                <label for="dateSelect">Viewing</label>
                <input type="date" id="dateSelect">
            </div>

            <div class="hero-card">
                <div class="hero-kcal">
                    <span id="ringCalories">0</span> kcal <small id="heroDateLabel">today</small>
                </div>
                <div class="macro-rings">
                    <div class="macro-ring-wrap">
                        <div class="macro-ring" id="proteinRing" style="--ring-color: var(--macro-protein);">
                            <div class="macro-ring-inner"><span class="macro-ring-value">0%</span></div>
                        </div>
                        <div class="macro-ring-label">Protein</div>
                    </div>
                    <div class="macro-ring-wrap">
                        <div class="macro-ring" id="carbsRing" style="--ring-color: var(--macro-carbs);">
                            <div class="macro-ring-inner"><span class="macro-ring-value">0%</span></div>
                        </div>
                        <div class="macro-ring-label">Carbs</div>
                    </div>
                    <div class="macro-ring-wrap">
                        <div class="macro-ring" id="fatRing" style="--ring-color: var(--macro-fat);">
                            <div class="macro-ring-inner"><span class="macro-ring-value">0%</span></div>
                        </div>
                        <div class="macro-ring-label">Fat</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2>Last 7 Days</h2>
                <div id="weekChart"></div>
            </div>
        </div>

        <div class="side-panel">
            <div class="card">
                <h2 id="breakdownHeading">Today's Breakdown</h2>
                <div id="mealBreakdown"></div>
            </div>
        </div>
    </main>
</div>

<script src="progress.js"></script>
</body>
</html>
